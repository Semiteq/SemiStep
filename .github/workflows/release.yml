name: release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build & Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: extract version and release notes from tag
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # Extract annotated tag message (empty for lightweight tags)
          BODY=$(git tag -l --format='%(contents)' "$TAG" | sed '/^$/d')
          if [ -n "$BODY" ]; then
            echo "Release notes found in tag annotation"
          else
            BODY="Release $VERSION"
            echo "No tag annotation found, using default body"
          fi

          # Write multiline body to GITHUB_OUTPUT
          {
            echo "body<<RELEASE_NOTES_EOF"
            echo "$BODY"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: publish
        run: dotnet publish SemiStep/SemiStep.UI/SemiStep.UI.csproj -c Release -p:Version=${{ steps.version.outputs.version }}

      # The jrsoftware.org direct download intermittently serves a corrupted file, so winget
      # (preinstalled on windows runners) installs it instead. Machine scope keeps the
      # Program Files (x86) path the build-installer step expects.
      - name: install Inno Setup
        shell: powershell
        run: |
          winget install --id JRSoftware.InnoSetup --exact --scope machine --silent `
            --accept-source-agreements --accept-package-agreements --disable-interactivity
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: build installer
        shell: cmd
        run: iscc.exe /DAppVersion=${{ steps.version.outputs.version }} Installer/SemiStep.iss

      - name: create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: SemiStep ${{ steps.version.outputs.version }}
          body: ${{ steps.version.outputs.body }}
          draft: false
          prerelease: false
          make_latest: true
          files: |
            Installer/Output/SemiStep-Setup.exe
