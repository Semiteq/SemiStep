# Temperature setpoint, step change
90:
  ui_name: "t°C скачком"
  deploy_duration: immediate
  columns:
    - key: target
      group_name: heater
      property_type_id: enum
    - key: task
      property_type_id: temp
      default_value: "500"
    - key: comment
      property_type_id: string

# Temperature setpoint, step change + wait
100:
  ui_name: "t°C скачком + ждать"
  deploy_duration: longlasting
  columns:
    - key: target
      group_name: heater
      property_type_id: enum
    - key: task
      property_type_id: temp
      default_value: "500"
    - key: step_duration
      property_type_id: time
      default_value: "60"
    - key: comment
      property_type_id: string

# Temperature setpoint, ramp
110:
  ui_name: "t°C плавно"
  deploy_duration: immediate
  columns:
    - key: target
      group_name: heater
      property_type_id: enum
    - key: initial_value
      property_type_id: temp
      default_value: "500"
    - key: task
      property_type_id: temp
      default_value: "600"
    - key: speed
      property_type_id: temp_speed
      default_value: "10"
    - key: step_duration
      property_type_id: time
      default_value: "600"
    - key: comment
      property_type_id: string
  formula:
    recalc_order: [step_duration, speed, task, initial_value]
    expressions:
      step_duration: "(task - initial_value) / speed * 60"
      speed:         "(task - initial_value) / step_duration * 60"
      task:          "initial_value + speed * step_duration / 60"
      initial_value: "task - speed * step_duration / 60"

