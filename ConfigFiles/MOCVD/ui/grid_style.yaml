# Grid Style Configuration
# Color formats supported:
#   - #RRGGBB     (e.g., #FFFFFF)
#   - #AARRGGBB   (e.g., #00FFFFFF for fully transparent white)
# Alpha: 00 = fully transparent, FF = fully opaque

fonts:
  # Font family plus per-role weight and italic are configurable in-app (View > Grid Style Settings).
  family: ""
  header_size: 12
  header_weight: 600
  header_italic: false
  cell_size: 12
  cell_weight: 400
  cell_italic: false

layout:
  cell_padding_left: 6
  cell_padding_top: 4
  cell_padding_right: 6
  cell_padding_bottom: 4
  row_height: 28

colors:
  selection:
    accent: "#3574F0"
    weight: 0.25
  cells:
    changed: "#FFCC80"
    readonly:
      depth_0: "#D8D8D8"
    disabled:
      depth_0: "#E0E0E0"
    execution:
      running: "#208A3C"
      running_weight: 0.30
      past_weight: 0.12
    loop:
      color: "#7D4DC8"
      depth_1_weight: 0.08
      depth_2_weight: 0.16
      depth_3_weight: 0.26
  grid_line: "#E0E0E0"

status_bar:
  background: "#F7F8FA"
  foreground: "#000000"
  # Top and bottom only; the bar keeps fixed 12 px side insets.
  padding: 5
  # The status-bar font is configurable in-app and applies to every bar text, timers included.
  font_size: 12
  weight: 400
  italic: false

validation_panel:
  background: "#FFFFFF"
  foreground: "#000000"
  error_color: "#D32F2F"
  warning_color: "#F57C00"
  max_height: 100

chrome:
  info: "#1976D2"
  connected: "#208A3C"
  disconnected: "#DB3B4B"
  panel_background: "#F8F8F8"
  panel_header_background: "#EEEEEE"
  subtle_border: "#D0D0D0"
  separator: "#C0C0C0"
  secondary_foreground: "#6C707E"
  grid_border: "#808080"
  grid_background: "#FFFFFF"
  header_foreground: "#6C707E"
