fonts:
  header_size: 14
  cell_size: 12

layout:
  cell_padding_left: 6
  cell_padding_top: 4
  cell_padding_right: 6
  cell_padding_bottom: 4
  row_height: 28

colors:
  selection:
    background: "#CCE4F7"
    foreground: "#202020"
  cells:
    readonly:
      depth_0: "#D8D8D8"
      depth_1: "#CCD5E0"
      depth_2: "#B8C3D1"
      depth_3: "#94A2B3"
      depth_0_past: "#C8C8C8"
      depth_1_past: "#BCC4CE"
      depth_2_past: "#ACB7C2"
      depth_3_past: "#8590A0"
      selected: "#DCE8F4"
      foreground: "#606060"
    disabled:
      depth_0: "#E0E0E0"
      depth_1: "#D5DEEA"
      depth_2: "#C2CEDB"
      depth_3: "#9DABBC"
      depth_0_past: "#D0D0D0"
      depth_1_past: "#C5CDD8"
      depth_2_past: "#B5C0CC"
      depth_3_past: "#909AAA"
      selected: "#E2E9F2"
      foreground: "#808080"
    execution:
      depth_0: "#FFFFFF"
      depth_1: "#E8F3FF"
      depth_2: "#D0E7FF"
      depth_3: "#A8D0FF"
      depth_0_past: "#F0F0F0"
      depth_1_past: "#DCE5EE"
      depth_2_past: "#C4D2E0"
      depth_3_past: "#9CB4CC"
      current_step_marker: "#FF8800"
  rows:
    alternating_background: "#FAFAFA"
    normal_background: "#FFFFFF"
  grid_line: "#E0E0E0"

borders:
  grid_line_thickness: 1.0

status_bar:
  background: "#F0F0F0"
  foreground: "#000000"
  padding: 5
  item_spacing: 10

validation_panel:
  background: "#FFFFFF"
  foreground: "#000000"
  error_color: "#D32F2F"
  warning_color: "#F57C00"
  max_height: 100
