# Valid control for SubactionsOnlyCycle: a primary action targets 3001, 3001 targets 3002,
# and 3002 does not target 3001, so the reference graph has no cycle

300:
  ui_name: "Branching"
  role: action
  deploy_duration: immediate
  columns:
    - key: entry_sel
      group_name: match_mode
      property_type_id: enum
      targets: { 1: 3001 }

3001:
  ui_name: "Branch A"
  role: subaction
  deploy_duration: immediate
  columns:
    - key: branch_sel
      group_name: match_mode
      property_type_id: enum
      targets: { 1: 3002 }

3002:
  ui_name: "Branch B"
  role: subaction
  deploy_duration: immediate
  columns:
    - key: comment
      property_type_id: string
