# Default grid style options for tests
fonts:
  header_size: 12
  cell_size: 11

layout:
  row_height: 24

colors:
  cells:
    disabled:
      normal: "#E0E0E0"
      selected: "#89B4D7"
      foreground: "#808080"
  execution:
    depth_0: "#FFFFFF"
    depth_1: "#E8F3FF"
    depth_2: "#D0E7FF"
    depth_3: "#A8D0FF"
    depth_0_past: "#F0F0F0"
    depth_1_past: "#DCE5EE"
    depth_2_past: "#C4D2E0"
    depth_3_past: "#9CB4CC"
    current_step_marker: "#FF8800"
