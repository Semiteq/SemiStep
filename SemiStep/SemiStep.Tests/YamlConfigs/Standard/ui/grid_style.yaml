# Default grid style options for tests
fonts:
  header_size: 12
  cell_size: 11

layout:
  row_height: 24

colors:
  selection:
    accent: "#3574F0"
    weight: 0.25
  cells:
    readonly:
      depth_0: "#D8D8D8"
    disabled:
      depth_0: "#E0E0E0"
    execution:
      running: "#208A3C"
      running_weight: 0.30
      past_weight: 0.12
    loop:
      color: "#7D4DC8"
      depth_1_weight: 0.08
      depth_2_weight: 0.16
      depth_3_weight: 0.26
